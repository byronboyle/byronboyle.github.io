<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denver Noise Network | Live Map</title>
    <!-- Leaflet.js CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .navbar {
            height: 56px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }
        .navbar-brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .stat-highlight { color: #00e676; font-weight: 700; }

        /* Map & Layout Container */
        .main-container {
            position: relative;
            flex: 1;
            width: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* Map Floating Legend (AQICN Style) */
        .map-overlay-legend {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
            z-index: 999;
            font-size: 0.8rem;
        }
        .legend-title { font-weight: 600; margin-bottom: 8px; color: #fff; }
        .legend-scale { display: flex; flex-direction: column; gap: 6px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-badge {
            width: 24px;
            height: 16px;
            border-radius: 4px;
            display: inline-block;
        }

        /* AQICN-Style Map Badge Markers */
        .aqi-marker-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.82rem;
            color: #000;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            border: 1.5px solid #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            padding: 2px 6px;
            white-space: nowrap;
        }
        .aqi-marker-badge:hover {
            transform: scale(1.15);
            z-index: 1000 !important;
        }

        /* Color States based on Last Hour Exceedances */
        .badge-green { background-color: #00e676; color: #000; }  /* 0 Exceedances */
        .badge-yellow { background-color: #ffeb3b; color: #000; } /* 1-2 Exceedances */
        .badge-red { background-color: #ff5252; color: #fff; }    /* 3+ Exceedances */

        /* Site Detail Slide-Out Panel */
        .detail-panel {
            position: absolute;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100%;
            background: #1a1a1a;
            border-left: 1px solid #333;
            z-index: 1001;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0,0,0,0.5);
        }
        .detail-panel.open { right: 0; }
        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            align-self: flex-end;
        }
        .close-btn:hover { color: #fff; }

        .panel-header h2 { margin: 0 0 4px 0; color: #fff; font-size: 1.2rem; }
        .panel-header p { margin: 0 0 16px 0; color: #888; font-size: 0.85rem; }

        .metric-card {
            background: #242424;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #333;
        }
        .metric-card h4 { margin: 0 0 6px 0; color: #888; font-size: 0.75rem; text-transform: uppercase; }
        .metric-val { font-size: 1.8rem; font-weight: 700; color: #00e676; }

        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn-primary { background: #00e676; color: #000; }
        .btn-primary:hover { background: #00c853; }
        .btn-secondary { background: #333; color: #fff; }
        .btn-secondary:hover { background: #444; }

        .chart-box { height: 180px; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="navbar-brand">🔊 Denver Acoustic Noise Network</div>
        <div class="navbar-stats">
            <div>Active Stations: <span class="stat-highlight" id="active-count">3</span></div>
            <div>City Threshold: <span style="color:#ff9100; font-weight:bold;">85 dBA</span></div>
        </div>
    </div>

    <div class="main-container">
        <!-- Floating Map Legend -->
        <div class="map-overlay-legend">
            <div class="legend-title">Exceedances (Last Hour)</div>
            <div class="legend-scale">
                <div class="legend-item"><span class="legend-badge badge-green"></span> 0 Exceedances (Normal)</div>
                <div class="legend-item"><span class="legend-badge badge-yellow"></span> 1–2 Exceedances (Warning)</div>
                <div class="legend-item"><span class="legend-badge badge-red"></span> 3+ Exceedances (Alert)</div>
            </div>
        </div>

        <!-- Fullscreen Map -->
        <div id="map"></div>

        <!-- Site Specific Detail Drawer -->
        <div class="detail-panel" id="detail-panel">
            <button class="close-btn" onclick="closePanel()">&times;</button>
            <div class="panel-header">
                <h2 id="panel-title">Station Location</h2>
                <p id="panel-address">Address details...</p>
            </div>

            <div class="metric-card">
                <h4>Live Sound Level</h4>
                <div class="metric-val"><span id="panel-db">0.0</span> <span style="font-size: 1rem; color: #888;">dBA</span></div>
            </div>

            <div class="metric-card">
                <h4>Exceedances (Last Hour)</h4>
                <div class="metric-val" id="panel-hourly" style="color: #ff5252;">0</div>
            </div>

            <div class="chart-box">
                <canvas id="miniChart"></canvas>
            </div>

            <button class="action-btn btn-primary" onclick="trigger311Report()">🚨 File 311 Noise Report</button>
            <button class="action-btn btn-secondary" onclick="exportStationCSV()">📥 Export Station CSV Data</button>
        </div>
    </div>

    <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://canlnrismlirrnfqpqmv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_kmsN-gDTrMOuhLIBPOMEdA_pi-LqN3p";
    const DECIBEL_THRESHOLD = 85.0;

    // --- MULTI-METER LOCATIONS DATA ---
    const METER_STATIONS = [
        {
            id: "meter-01",
            name: "Federal Blvd Monitor",
            address: "3265 Federal Blvd, Denver, CO",
            lat: 39.76285,
            lng: -105.02506,
            currentDba: 64.2,
            hourlyExceedances: 0
        },
        {
            id: "meter-02",
            name: "Colfax & Broadway",
            address: "1500 Broadway, Denver, CO",
            lat: 39.7402,
            lng: -104.9877,
            currentDba: 87.5,
            hourlyExceedances: 3
        },
        {
            id: "meter-03",
            name: "RiNo Arts District",
            address: "2901 Blake St, Denver, CO",
            lat: 39.7635,
            lng: -104.9785,
            currentDba: 78.1,
            hourlyExceedances: 1
        }
    ];

    // --- LEAFLET MAP SETUP ---
    const map = L.map('map').setView([39.752, -105.000], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let activeMarkerObj = null;
    let miniChartInstance = null;

    // --- GENERATE AQICN-STYLE NUMERICAL BADGES ---
    function getBadgeClass(exceedances) {
        if (exceedances === 0) return 'badge-green';
        if (exceedances <= 2) return 'badge-yellow';
        return 'badge-red';
    }

    function createBadgeIcon(dba, exceedances) {
        const badgeClass = getBadgeClass(exceedances);
        return L.divIcon({
            className: 'custom-aqi-icon',
            html: `<div class="aqi-marker-badge ${badgeClass}">${dba.toFixed(1)} dBA</div>`,
            iconSize: [80, 28],
            iconAnchor: [40, 14]
        });
    }

    // Render Markers on Map
    const markersMap = new Map();

    METER_STATIONS.forEach(station => {
        const marker = L.marker([station.lat, station.lng], {
            icon: createBadgeIcon(station.currentDba, station.hourlyExceedances)
        }).addTo(map);

        marker.on('click', () => openDetailPanel(station));
        markersMap.set(station.id, marker);
    });

    // --- SUPABASE LIVE FETCH FOR PRIMARY METER ---
    async function fetchLivePrimaryMeter() {
        try {
            // Fetch live reading for Federal Blvd meter from Supabase
            const res = await fetch(`${SUPABASE_URL}/rest/v1/noise_logs?select=*&order=timestamp.desc&limit=1`, {
                headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
            });
            const data = await res.json();
            
            if (data && data.length > 0) {
                const liveDba = Number(data[0].dba);
                
                // Fetch last hour exceedances
                const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000).toISOString();
                const exceedRes = await fetch(`${SUPABASE_URL}/rest/v1/noise_logs?select=id&timestamp=gte.${oneHourAgo}&dba=gte.${DECIBEL_THRESHOLD}`, {
                    headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const exceedData = await exceedRes.json();
                const hourlyCount = Array.isArray(exceedData) ? exceedData.length : 0;

                // Update primary station record
                const primary = METER_STATIONS[0];
                primary.currentDba = liveDba;
                primary.hourlyExceedances = hourlyCount;

                // Update map marker icon live
                const primaryMarker = markersMap.get(primary.id);
                if (primaryMarker) {
                    primaryMarker.setIcon(createBadgeIcon(liveDba, hourlyCount));
                }

                // Update side panel if open
                if (activeMarkerObj && activeMarkerObj.id === primary.id) {
                    document.getElementById('panel-db').innerText = liveDba.toFixed(1);
                    document.getElementById('panel-hourly').innerText = hourlyCount;
                }
            }
        } catch (err) {
            console.error("Supabase live sync error:", err);
        }
    }

    // --- PANEL & CHART INTERACTIVITY ---
    function openDetailPanel(station) {
        activeMarkerObj = station;
        document.getElementById('panel-title').innerText = station.name;
        document.getElementById('panel-address').innerText = station.address;
        document.getElementById('panel-db').innerText = station.currentDba.toFixed(1);
        document.getElementById('panel-hourly').innerText = station.hourlyExceedances;

        document.getElementById('detail-panel').classList.add('open');
        map.panTo([station.lat, station.lng], { animate: true, duration: 0.5 });

        renderMiniChart();
    }

    function closePanel() {
        document.getElementById('detail-panel').classList.remove('open');
        activeMarkerObj = null;
    }

    function renderMiniChart() {
        const ctx = document.getElementById('miniChart').getContext('2d');
        if (miniChartInstance) miniChartInstance.destroy();

        miniChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['12m ago', '9m ago', '6m ago', '3m ago', 'Now'],
                datasets: [{
                    label: 'dBA Level',
                    data: [62.1, 65.4, 82.0, 71.3, activeMarkerObj ? activeMarkerObj.currentDba : 65.0],
                    borderColor: '#00e676',
                    backgroundColor: 'rgba(0, 230, 118, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#888', font: { size: 10 } }, grid: { color: '#333' } },
                    y: { ticks: { color: '#888', font: { size: 10 } }, grid: { color: '#333' } }
                }
            }
        });
    }

    function trigger311Report() {
        alert(`Filing 311 Report for ${activeMarkerObj ? activeMarkerObj.name : 'Selected Location'}...`);
    }

    function exportStationCSV() {
        alert(`Downloading historical CSV dataset for ${activeMarkerObj ? activeMarkerObj.name : 'Station'}...`);
    }

    // Live Sync Timers
    fetchLivePrimaryMeter();
    setInterval(fetchLivePrimaryMeter, 5000);
    </script>
</body>
</html>
